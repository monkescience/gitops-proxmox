fullnameOverride: otlp-auth-proxy
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector
command:
  name: otelcol

# Inject the ClickStack ingestion key (stored as a cluster secret, not in git).
extraEnvs:
  - name: INGEST_KEY
    valueFrom:
      secretKeyRef:
        name: clickstack-ingest-key
        key: key

# Pure forwarder: receive OTLP from the cluster telemetry agent, add the
# ClickStack ingestion auth header, forward to the ClickStack collector.
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
  exporters:
    otlphttp/clickstack:
      endpoint: http://clickstack-otel-collector.clickstack.svc.cluster.local:4318
      headers:
        authorization: ${env:INGEST_KEY}
  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/clickstack]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/clickstack]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/clickstack]
