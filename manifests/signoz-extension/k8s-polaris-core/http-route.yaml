apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz
  namespace: observability
spec:
  parentRefs:
    - name: public
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /signoz
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /signoz/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /signoz
      backendRefs:
        - name: signoz
          port: 8080
