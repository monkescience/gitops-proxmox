apiVersion: v1
kind: ServiceAccount
metadata:
  name: signoz-root-user-init
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signoz-root-user-init
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signoz-root-user-init
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: signoz-root-user-init
subjects:
  - kind: ServiceAccount
    name: signoz-root-user-init
    namespace: observability
---
apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-root-user-init
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: signoz-root-user-init
      restartPolicy: Never
      containers:
        - name: init
          image: alpine/k8s:1.36.1
          command:
            - sh
            - -c
            - |
              set -eu
              if kubectl get secret signoz-root-user -n observability >/dev/null 2>&1; then
                echo "signoz-root-user secret already exists, nothing to do"
                exit 0
              fi
              rand() { LC_ALL=C tr -dc "$1" </dev/urandom | head -c "$2"; }
              password="$(rand 'A-Z' 4)$(rand 'a-z' 4)$(rand '0-9' 4)$(rand '!@#%^*_=+-' 4)"
              kubectl create secret generic signoz-root-user \
                --namespace observability \
                --from-literal=password="$password"
              echo "generated signoz-root-user secret"
